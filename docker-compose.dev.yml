services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taakify
    ports:
      - "5433:5432"
    volumes:
      - taakify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # PINNED, not `latest` (issue #28): the Electric server's shape protocol
  # evolves between releases, while apps/web pins @electric-sql/client — a
  # floating tag silently changes the sync engine under the pinned client
  # whenever anyone re-pulls, and a mid-session version change can wedge
  # shape handles server-side (reloads never clear it; a container restart
  # does). Verified compatible pair — bump BOTH together and re-verify a
  # fresh signup reaches a synced SyncBadge (no "Sync unavailable") before
  # committing the change.
  electric:
    image: electricsql/electric:1.7.7
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taakify?sslmode=disable
      ELECTRIC_INSECURE: "true"   # dev only — Plan 5 configures auth for production
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  taakify_pgdata:
